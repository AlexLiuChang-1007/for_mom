<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>给最亲爱的妈妈</title>
    <style>
        :root {
            --primary-pink: #ffafbd;
            --secondary-pink: #ffc3a0;
            --text-brown: #5d4037;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }

        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #fff5ee; 
            font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
        }

        /* 统一背景流光 */
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            z-index: -1; opacity: 0.6;
        }

        /* 场景控制 */
        .scene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; transition: opacity 0.8s ease;
        }
        .scene.active { display: flex; animation: fadeIn 1s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- 场景1：信封 --- */
        #envelope {
            width: 200px; height: 140px; background: #fff; border-radius: 5px;
            position: relative; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        #envelope:after {
            content: ''; position: absolute; top: 0; left: 0;
            width: 0; height: 0; border-style: solid;
            border-width: 70px 100px 0 100px;
            border-color: #ffc3a0 transparent transparent transparent;
        }
        .open-hint { margin-top: 30px; color: #fff; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

        /* --- 场景2：互动生长 --- */
        #garden-canvas { position: absolute; top: 0; left: 0; z-index: 5; touch-action: none; }
        .garden-ui { position: relative; z-index: 10; color: #fff; text-align: center; pointer-events: none; }

        /* --- 场景3：主卡片 --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 40px 25px; width: 90%; max-width: 350px;
            text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .typewriter-text { min-height: 80px; color: var(--text-brown); line-height: 1.8; margin: 20px 0; font-weight: 500; }

        /* --- 场景4：爱的兑换券 --- */
        .coupon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-top: 20px; }
        .coupon {
            background: #fff; padding: 15px; border-radius: 15px;
            font-size: 0.9rem; color: #ff758c; border: 2px dashed #ffb6c1;
            box-shadow: 4px 4px 0px #ffb6c1; transition: 0.2s;
        }
        .coupon.used { background: #eee; border-color: #ccc; color: #999; box-shadow: none; transform: scale(0.95); }

        /* 通用按钮 */
        .btn {
            padding: 12px 30px; background: white; border-radius: 50px;
            border: none; color: #ff758c; font-weight: bold;
            box-shadow: 0 5px 15px rgba(255,117,140,0.3);
            margin-top: 20px;
        }

        #bgm-btn {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            width: 35px; height: 35px; background: rgba(255,255,255,0.5);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 20px; border: none;
        }
        .rotating { animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <button id="bgm-btn" onclick="toggleBGM()">🎵</button>
    <audio id="bgm" src="https://www.image2url.com/r2/default/audio/1778340688432-2f2eae9e-cb05-4a95-95cb-a345b08abf41.mp3" loop></audio>

    <div class="scene active" id="scene1">
        <div id="envelope" onclick="goToScene(2)"></div>
        <p class="open-hint">妈妈亲启，拆开惊喜 ✨</p>
    </div>

    <div class="scene" id="scene2">
        <canvas id="garden-canvas"></canvas>
        <div class="garden-ui">
            <h2>为妈妈播种花海</h2>
            <p>在屏幕上轻轻滑动手指...</p>
        </div>
        <button class="btn" style="position:absolute; bottom:100px; z-index:20" onclick="goToScene(3)">完成播种 ✨</button>
    </div>

    <div class="scene" id="scene3">
        <div class="glass-card">
            <div style="font-size: 50px; animation: heartbeat 1.5s infinite;">💐</div>
            <h2 style="color: #5d4037; margin: 10px 0;">母亲节快乐</h2>
            <div class="typewriter-text" id="typewriter"></div>
            <button class="btn" onclick="goToScene(4)">还有小惊喜 ✨</button>
        </div>
    </div>

    <div class="scene" id="scene4">
        <div class="glass-card">
            <h3>🎁 爱的兑换券</h3>
            <p style="font-size: 0.8rem; margin-bottom: 10px;">点击卡片即可永久核销(我赖不掉的)</p>
            <div class="coupon-grid">
                <div class="coupon" onclick="useCoupon(this)">终身洗碗券</div>
                <div class="coupon" onclick="useCoupon(this)">专属拥抱券</div>
                <div class="coupon" onclick="useCoupon(this)">陪逛街1整天</div>
                <div class="coupon" onclick="useCoupon(this)">不准生气券</div>
            </div>
            <button class="btn" onclick="alert('妈妈我爱你！永远爱你！')">保存这张截图 ❤️</button>
        </div>
    </div>

    <script>
        // 场景管理
        function goToScene(index) {
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById('scene' + index).classList.add('active');
            
            if(index === 2) initGarden();
            if(index === 3) {
                startTypewriter();
                playBGM();
            }
        }

        // BGM 控制
        const bgm = document.getElementById('bgm');
        const bgmBtn = document.getElementById('bgm-btn');
        function playBGM() {
            bgm.play();
            bgmBtn.classList.add('rotating');
        }
        function toggleBGM() {
            if(bgm.paused) { bgm.play(); bgmBtn.classList.add('rotating'); }
            else { bgm.pause(); bgmBtn.classList.remove('rotating'); }
        }

        // 场景2逻辑：花朵互动
        function initGarden() {
            const canvas = document.getElementById('garden-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            function drawFlower(x, y) {
                const petals = 6;
                const radius = Math.random() * 10 + 5;
                ctx.fillStyle = `hsl(${Math.random() * 30 + 330}, 80%, 70%)`;
                for (let i = 0; i < petals; i++) {
                    const angle = (i * 2 * Math.PI) / petals;
                    const px = x + Math.cos(angle) * radius;
                    const py = y + Math.sin(angle) * radius;
                    ctx.beginPath();
                    ctx.arc(px, py, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath(); ctx.arc(x, y, radius/2, 0, Math.PI * 2); ctx.fill();
            }

            canvas.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                drawFlower(touch.clientX, touch.clientY);
            });
        }

        // 场景3逻辑：打字机
        function startTypewriter() {
            const text = "感谢你不是超人，却为我变成了万能。\n在这个属于你的日子里，\n愿你被岁月温柔以待，永远是我的少女！";
            let i = 0;
            const target = document.getElementById('typewriter');
            target.innerHTML = "";
            function type() {
                if (i < text.length) {
                    target.innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
                    i++;
                    setTimeout(type, 100);
                }
            }
            type();
        }

        // 场景4逻辑：兑换券
        function useCoupon(el) {
            if(!el.classList.contains('used')) {
                el.classList.add('used');
                el.innerHTML += " ✅";
                // 手机震动反馈
                if(window.navigator.vibrate) window.navigator.vibrate(50);
            }
        }
    </script>
</body>
</html>
