<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>致最亲爱的妈妈 ❤️</title>
    <style>
        :root { 
            --p-pink: #ffafbd; 
            --s-pink: #ffc3a0; 
            --t-brown: #5d4037; 
            --gold: #d4af37;
            --glass: rgba(255, 255, 255, 0.75);
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #fff5ee; font-family: -apple-system, "SF Pro Display", "PingFang SC", sans-serif; 
        }

        /* 层级管理 */
        .layer-bg { position: fixed; inset: 0; z-index: -2; }
        .layer-decor { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .layer-ui { position: relative; width: 100%; height: 100%; z-index: 10; }

        /* 动态背景 */
        .bg-gradient {
            width: 100%; height: 100%;
            background: linear-gradient(125deg, #ff9a9e, #fecfef, #feada6, #fad0c4);
            background-size: 400% 400%;
            animation: moveBG 15s ease infinite;
        }
        @keyframes moveBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        /* 场景容器 */
        .scene {
            position: absolute; inset: 0;
            display: none; flex-direction: column; 
            align-items: center; justify-content: center;
            padding: 40px; text-align: center;
        }
        .active { display: flex; animation: sceneSwitch 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        @keyframes sceneSwitch {
            from { opacity: 0; filter: blur(10px); transform: scale(0.9); }
            to { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        /* 玻璃卡片 */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 35px; border: 1px solid rgba(255,255,255,0.8);
            padding: 40px 30px; width: 100%; max-width: 360px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; align-items: center;
        }

        .shimmer-text {
            background: linear-gradient(to right, #5d4037 0%, #d4af37 50%, #5d4037 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            font-weight: bold;
        }
        @keyframes shimmer { to { background-position: 200% center; } }

        .btn-main {
            margin-top: 30px; padding: 16px 45px; 
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: #fff; border-radius: 50px; border: none;
            font-weight: bold; font-size: 1rem; cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-main:active { transform: scale(0.9); }

        /* 信封 */
        .envelope {
            width: 200px; height: 140px; background: #fff; position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-radius: 4px;
            cursor: pointer; transition: 0.5s;
        }
        .envelope::after {
            content: ''; position: absolute; top: 0; left: 0;
            width: 0; height: 0; border-left: 100px solid transparent;
            border-right: 100px solid transparent; border-top: 75px solid #ffc3a0;
        }
        .heart { position: absolute; top: 50px; left: 85px; font-size: 30px; z-index: 5; animation: pulse 1.5s infinite; }

        /* 装饰与词云 */
        .word-cloud { position: absolute; width: 100%; height: 100%; pointer-events: none; }
        .word-item { position: absolute; color: rgba(93, 64, 55, 0.3); font-weight: bold; animation: floatUp 10s linear forwards; }
        @keyframes floatUp { from { transform: translateY(100vh); opacity: 0; } to { transform: translateY(-100px); opacity: 0.8; } }
        .fall-emoji { position: fixed; z-index: -1; animation: falling 7s linear infinite; }
        @keyframes falling { to { transform: translateY(110vh) rotate(360deg); } }

        #music-toggle {
            position: fixed; top: 25px; right: 25px; z-index: 1000;
            width: 44px; height: 44px; border-radius: 50%; background: var(--glass);
            border: 1px solid #fff; display: flex; align-items: center; justify-content: center;
        }

        .coupon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 20px; }
        .coupon {
            background: #fff; padding: 15px 10px; border-radius: 15px; border: 1px dashed #ffafbd;
            font-size: 0.85rem; color: #ff758c; transition: 0.3s;
        }
        .coupon.used { background: #eee; color: #bbb; border-style: solid; text-decoration: line-through; }
    </style>
</head>
<body>

<div class="layer-bg"><div class="bg-gradient"></div></div>
<div class="layer-decor" id="decor-container"></div>

<button id="music-toggle" onclick="togglePlay()">🔇</button>
<audio id="bgm" loop src="https://www.image2url.com/r2/default/audio/1778340688432-2f2eae9e-cb05-4a95-95cb-a345b08abf41.mp3"></audio>

<div class="layer-ui">
    <section class="scene active" id="s1">
        <div class="envelope" onclick="nextScene(2)">
            <div class="heart">❤️</div>
        </div>
        <h2 class="shimmer-text" style="margin-top:40px; font-size:22px; letter-spacing:4px;">妈妈，见字如面</h2>
        <p style="color:#5d4037; opacity:0.7; margin-top:10px;">点击信封开启时光之旅</p>
    </section>

    <section class="scene" id="s2">
        <canvas id="garden-canvas" style="position:absolute; inset:0; z-index: 1; touch-action: none;"></canvas>
        <div class="glass-card" id="garden-tip" style="pointer-events:none; margin-bottom: 120px; z-index: 10; transition: all 0.6s ease;">
            <p class="shimmer-text" style="font-size:1.2rem;">在这里，画出一片春天</p>
            <p style="font-size: 0.9rem; color: #888; margin-top: 10px;">滑动手指试试看</p>
        </div>
        <button class="btn-main" style="position:absolute; bottom:80px; z-index: 100;" onclick="nextScene(3)">看，花开好了 🌻</button>
    </section>

    <section class="scene" id="s3">
        <div class="word-cloud" id="word-cloud"></div>
        <div class="glass-card">
            <div style="font-size:40px;">🕰️</div>
            <h2 class="shimmer-text" style="margin:15px 0;">岁月的痕迹</h2>
            <div id="typed" style="min-height:80px; color:var(--t-brown); line-height:1.8;"></div>
            <div style="text-align:right; width:100%; color:#ff758c; font-weight:bold; margin-top:10px;">—— Alex</div>
            <button class="btn-main" onclick="nextScene(4)">还没完哦，点这里 🎁</button>
        </div>
    </section>

    <section class="scene" id="s4">
        <div class="glass-card">
            <h3 class="shimmer-text" style="font-size:22px;">爱意无限公司兑换券</h3>
            <div class="coupon-grid">
                <div class="coupon" onclick="use(this)">一整周洗碗</div>
                <div class="coupon" onclick="use(this)">全身按摩30分</div>
                <div class="coupon" onclick="use(this)">陪逛街不还嘴</div>
                <div class="coupon" onclick="use(this)">超级解忧拥抱</div>
            </div>
            <button class="btn-main" onclick="finalSurprise()">❤️ 确认收下 ❤️</button>
        </div>
    </section>
</div>

<script>
    const bgm = document.getElementById('bgm');
    let isPlaying = false;

    function togglePlay() {
        const btn = document.getElementById('music-toggle');
        if(isPlaying) { bgm.pause(); btn.innerText = "🔇"; }
        else { bgm.play(); btn.innerText = "🎵"; }
        isPlaying = !isPlaying;
    }

    function nextScene(idx) {
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
        document.getElementById('s'+idx).classList.add('active');
        if(idx === 2) { if(!isPlaying) togglePlay(); initGarden(); }
        if(idx === 3) { initWordCloud(); startTyping(); }
    }

    // 💡 彻底修复的种花逻辑
    function initGarden() {
        const c = document.getElementById('garden-canvas');
        const tip = document.getElementById('garden-tip');
        const ctx = c.getContext('2d');
        c.width = window.innerWidth;
        c.height = window.innerHeight;

        let hasStarted = false;

        function hideTip() {
            if (!hasStarted) {
                tip.style.opacity = '0';
                tip.style.transform = 'scale(0.8) translateY(-20px)';
                setTimeout(() => { tip.style.display = 'none'; }, 600);
                hasStarted = true;
            }
        }

        // 强力监听触碰事件
        c.addEventListener('touchstart', (e) => {
            hideTip();
        }, { passive: false });

        c.addEventListener('touchmove', (e) => {
            e.preventDefault(); // 阻止页面滚动
            hideTip();
            const t = e.touches[0];
            for(let i=0; i<3; i++) {
                drawFlower(ctx, t.clientX + (Math.random()-0.5)*40, t.clientY + (Math.random()-0.5)*40);
            }
        }, { passive: false });
    }

    function drawFlower(ctx, x, y) {
        const petals = 6; const r = Math.random()*8+4;
        ctx.fillStyle = `rgba(255, ${180+Math.random()*40}, ${190+Math.random()*40}, 0.7)`;
        for(let i=0; i<petals; i++) {
            ctx.beginPath();
            ctx.arc(x + Math.cos(i*2*Math.PI/petals)*r, y + Math.sin(i*2*Math.PI/petals)*r, r, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, r/2, 0, Math.PI*2); ctx.fill();
    }

    function initWordCloud() {
        const words = ['温柔','超人妈妈','少女心','避风港','厨神','坚强','最爱你了','辛苦了','最美'];
        const container = document.getElementById('word-cloud');
        const cloudTimer = setInterval(() => {
            if(document.getElementById('s3').classList.contains('active')) {
                const w = document.createElement('div');
                w.className = 'word-item';
                w.innerText = words[Math.floor(Math.random()*words.length)];
                w.style.left = Math.random()*80 + 10 + '%';
                w.style.fontSize = Math.random()*15 + 15 + 'px';
                container.appendChild(w);
                setTimeout(() => w.remove(), 10000);
            } else { clearInterval(cloudTimer); }
        }, 800);
    }

    function startTyping() {
        const text = "感谢你不是超人，\n却为我变成了万能。\n愿时光慢些走，\n让我能爱你久一点、再久一点。";
        let n = 0; const target = document.getElementById('typed');
        target.innerHTML = "";
        const typeTimer = setInterval(() => {
            if(n < text.length) {
                target.innerHTML += text[n] === '\n' ? '<br>' : text[n];
                n++;
            } else clearInterval(typeTimer);
        }, 100);
    }

    function use(el) {
        if(!el.classList.contains('used')) {
            el.classList.add('used');
            el.innerText += " ✅";
            if(navigator.vibrate) navigator.vibrate(40);
        }
    }

    function finalSurprise() {
        for(let i=0; i<50; i++) {
            setTimeout(() => {
                const h = document.createElement('div');
                h.style.cssText = `position:fixed; top:-50px; left:${Math.random()*100}%; font-size:${Math.random()*20+20}px; z-index:1000; pointer-events:none; transition:transform 3s linear;`;
                h.innerHTML = ['❤️','💖','💗','🌸'][Math.floor(Math.random()*4)];
                document.body.appendChild(h);
                setTimeout(() => h.style.transform = `translateY(${window.innerHeight + 100}px) rotate(${Math.random()*360}deg)`, 50);
                setTimeout(() => h.remove(), 3500);
            }, i * 100);
        }
        setTimeout(() => alert("母亲节快乐，Alex永远爱你！"), 2000);
    }

    setInterval(() => {
        const e = document.createElement('div');
        e.className = 'fall-emoji';
        e.innerHTML = ['🌸','✨','💗'][Math.floor(Math.random()*3)];
        e.style.left = Math.random()*100 + '%';
        e.style.fontSize = Math.random()*10+15+'px';
        e.style.opacity = Math.random();
        document.getElementById('decor-container').appendChild(e);
        setTimeout(() => e.remove(), 7000);
    }, 400);
</script>
</body>
</html>
