<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>给最亲爱的妈妈</title>
    <style>
        :root { --p-pink: #ffafbd; --s-pink: #ffc3a0; --t-brown: #5d4037; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #fff5ee; font-family: -apple-system, sans-serif; }

        /* 全局动态渐变背景 */
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(125deg, #ff9a9e, #fecfef, #feada6, #fad0c4);
            background-size: 400% 400%;
            animation: moveBG 15s ease infinite;
            z-index: -1;
        }
        @keyframes moveBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        /* 场景切换基础样式 */
        .scene {
            position: absolute; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
        }
        .active { display: flex; animation: sceneEnter 1s forwards; }
        @keyframes sceneEnter { from { opacity: 0; transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }

        /* 场景1：信封 */
        .envelope-wrapper { position: relative; width: 220px; height: 150px; background: #fff; border-radius: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); cursor: pointer; }
        .envelope-wrapper::before {
            content: ''; position: absolute; top: -2px; left: 0;
            width: 0; height: 0; border-left: 110px solid transparent; border-right: 110px solid transparent;
            border-top: 85px solid #ffc3a0; z-index: 2;
        }
        .heart-seal { position: absolute; top: 60px; left: 95px; font-size: 30px; z-index: 3; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* 场景2：画布互动 */
        #garden-canvas { position: absolute; top: 0; left: 0; z-index: 1; touch-action: none; }
        .instruction { position: absolute; top: 15%; color: black; font-size: 1.2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 5; pointer-events: none; }

        /* 场景3 & 4：通用卡片样式 */
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.5);
            padding: 40px 25px; width: 100%; max-width: 340px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); z-index: 10;
        }
        .btn {
            margin-top: 25px; padding: 12px 35px; background: #fff; color: #ff758c;
            border-radius: 50px; border: none; font-weight: bold; font-size: 1rem;
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.2); transition: 0.3s;
        }

        /* 场景4：兑换券细节 */
        .coupon-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .coupon-item {
            background: rgba(255,255,255,0.6); padding: 15px 10px; border-radius: 15px;
            font-size: 0.85rem; color: #d48181; border: 1px dashed #ffafbd;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .coupon-item.used { background: #d1d1d1; color: #888; border-color: #999; transform: rotate(-5deg); }

        #music-toggle {
            position: fixed; top: 25px; right: 25px; z-index: 1000;
            width: 40px; height: 40px; background: rgba(255,255,255,0.7);
            border-radius: 50%; border: none; font-size: 20px;
        }
    </style>
</head>
<body>

<div class="bg-layer"></div>
<button id="music-toggle" onclick="togglePlay()">🎵</button>
<audio id="bgm" loop src="https://www.image2url.com/r2/default/audio/1778340688432-2f2eae9e-cb05-4a95-95cb-a345b08abf41.mp3"></audio>

<div class="scene active" id="s1">
    <div class="envelope-wrapper" onclick="toScene(2)">
        <div class="heart-seal">❤️</div>
    </div>
    <p style="margin-top:40px; color:#000; letter-spacing:2px;">妈妈亲启，拆开惊喜</p>
</div>

<div class="scene" id="s2">
    <canvas id="garden-canvas"></canvas>
    <div class="instruction">
        <p>滑动手指</p>
        <p>种下满屏的花开</p>
    </div>
    <button class="btn" style="position:absolute; bottom:80px; z-index:100;" onclick="toScene(3)">收起花海 🌻</button>
</div>

<div class="scene" id="s3">
    <div class="glass-card">
        <div style="font-size:45px;">👩‍👧‍👦</div>
        <h2 style="color:var(--t-brown); margin:15px 0;">母亲节快乐</h2>
        <div id="typed" style="min-height:100px; line-height:1.8; color:#795548;"></div>
        <button class="btn" onclick="toScene(4)">还有小礼物 🎁</button>
    </div>
</div>

<div class="scene" id="s4">
    <div class="glass-card">
        <h3 style="color:var(--t-brown);">爱的兑换券</h3>
        <p style="font-size:0.8rem; color:#999; margin:5px 0 20px 0;">点击下方卡片即可生效</p>
        <div class="coupon-box">
            <div class="coupon-item" onclick="use(this)">洗碗一星期</div>
            <div class="coupon-item" onclick="use(this)">陪逛街不喊累</div>
            <div class="coupon-item" onclick="use(this)">专属拥抱券</div>
            <div class="coupon-item" onclick="use(this)">不准生气券</div>
        </div>
        <button class="btn" onclick="alert('妈妈，我也爱你！')">保存心意 ❤️</button>
    </div>
</div>

<script>
    const bgm = document.getElementById('bgm');
    let musicPlaying = false;

    function togglePlay() {
        if(musicPlaying) { bgm.pause(); } else { bgm.play(); }
        musicPlaying = !musicPlaying;
    }

    function toScene(idx) {
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
        document.getElementById('s' + idx).classList.add('active');
        
        if(idx === 2) { 
            if(!musicPlaying) togglePlay(); 
            startGarden(); 
        }
        if(idx === 3) startType();
    }

    // 场景2：种花逻辑
    function startGarden() {
        const c = document.getElementById('garden-canvas');
        const ctx = c.getContext('2d');
        c.width = window.innerWidth;
        c.height = window.innerHeight;

        function drawFlower(x, y) {
            const petals = 6;
            const r = Math.random() * 8 + 4;
            ctx.fillStyle = `rgba(255, ${150 + Math.random()*50}, ${180 + Math.random()*50}, 0.7)`;
            for(let i=0; i<petals; i++) {
                ctx.beginPath();
                ctx.arc(x + Math.cos(i*2*Math.PI/petals)*r, y + Math.sin(i*2*Math.PI/petals)*r, r, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.fillStyle = "#fff59d";
            ctx.beginPath(); ctx.arc(x, y, r/2, 0, Math.PI*2); ctx.fill();
        }

        c.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            drawFlower(t.clientX, t.clientY);
        });
    }

    // 场景3：打字机
    function startType() {
        const text = "感谢你不是超人，\n却为我变成了万能。\n愿你被岁月温柔以待，\n永远是我的少女！";
        let n = 0;
        const target = document.getElementById('typed');
        target.innerHTML = "";
        const timer = setInterval(() => {
            if(n < text.length) {
                target.innerHTML += text[n] === '\n' ? '<br>' : text[n];
                n++;
            } else { clearInterval(timer); }
        }, 100);
    }

    // 场景4：核销券
    function use(el) {
        if(!el.classList.contains('used')) {
            el.classList.add('used');
            el.innerHTML += " [已核销]";
            if(window.navigator.vibrate) window.navigator.vibrate(30);
        }
    }
</script>
</body>
</html>
