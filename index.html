<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>给最亲爱的妈妈 ❤️</title>
    <style>
        :root { --p-pink: #ffafbd; --s-pink: #ffc3a0; --t-brown: #5d4037; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #fff5ee; font-family: -apple-system, sans-serif; }

        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(125deg, #ff9a9e, #fecfef, #feada6, #fad0c4);
            background-size: 400% 400%;
            animation: moveBG 15s ease infinite;
            z-index: -1;
        }
        @keyframes moveBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .fall-item{
            position:fixed;
            top:-10%;
            z-index:1;
            pointer-events:none;
            animation:falling 6s linear infinite;
            font-size:18px;
        }
        @keyframes falling{
            0%{transform:translateY(0) rotate(0deg);opacity:0.9;}
            100%{transform:translateY(100vh) rotate(360deg);opacity:0;}
        }

        .heart-burst{
            position:fixed;
            pointer-events:none;
            z-index:9999;
            animation:burst 1.6s ease-out forwards;
            font-size:24px;
        }
        @keyframes burst{
            0%{opacity:1;transform:scale(1);}
            100%{opacity:0;transform:translateY(-220px) scale(1.5);}
        }

        .scene {
            position: absolute; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
        }
        .active { display: flex; animation: sceneEnter 1s forwards; }
        @keyframes sceneEnter { from { opacity: 0; transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }

        .envelope-wrapper { position: relative; width: 240px; height: 160px; background: #fff; border-radius: 10px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); cursor: pointer; transition:0.3s;}
        .envelope-wrapper:active{transform:scale(0.95);}
        .envelope-wrapper::before {
            content: ''; position: absolute; top: -2px; left: 0;
            width: 0; height: 0; border-left: 120px solid transparent; border-right: 120px solid transparent;
            border-top: 90px solid #ffc3a0; z-index: 2;
        }
        .heart-seal { position: absolute; top: 65px; left: 105px; font-size: 32px; z-index: 3; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        #garden-canvas { position: absolute; top: 0; left: 0; z-index: 1; touch-action: none; }
        .instruction { position: absolute; top: 15%; background: rgba(255, 255, 255, 0.5); padding: 12px 24px; border-radius: 25px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #444; font-size: 1.1rem; z-index: 5; pointer-events: none; transition:0.5s;}

        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.6);
            padding: 45px 30px; width: 100%; max-width: 360px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.12); z-index: 10;
        }
        .btn {
            margin-top: 28px; padding: 14px 40px; background: #ff758c; color: #fff;
            border-radius: 50px; border: none; font-weight: bold; font-size: 1rem;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4); transition: 0.3s;
        }
        .btn:active{transform:scale(0.95);}

        .coupon-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .coupon-item {
            background: rgba(255,255,255,0.7); padding: 16px 10px; border-radius: 18px;
            font-size: 0.85rem; color: #d48181; border: 1px dashed #ffafbd;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .coupon-item.used { background: #e0e0e0; color: #888; border-color: #aaa; transform: rotate(-4deg); }

        #music-toggle {
            position: fixed; top: 25px; right: 25px; z-index: 1000;
            width: 44px; height: 44px; background: rgba(255,255,255,0.8);
            border-radius: 50%; border: none; font-size: 22px; box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }
        .name-sign{
            margin-top:20px;
            text-align:right;
            color:#d93a70;
            font-weight:bold;
            font-size:17px;
        }
    </style>
</head>
<body>

<div class="bg-layer"></div>
<button id="music-toggle" onclick="togglePlay()">🎵</button>
<audio id="bgm" loop src="https://www.image2url.com/r2/default/audio/1778340688432-2f2eae9e-cb05-4a95-95cb-a345b08abf41.mp3"></audio>

<div class="scene active" id="s1">
    <div class="envelope-wrapper" onclick="toScene(2)">
        <div class="heart-seal">❤️</div>
    </div>
    <p style="margin-top:40px; color:#5d4037; font-weight: bold; letter-spacing:2px; font-size:18px;">妈妈亲启，拆开惊喜</p>
</div>

<div class="scene" id="s2">
    <canvas id="garden-canvas"></canvas>
    <div class="instruction">
        <p>滑动手指</p>
        <p>种下满屏花开</p>
    </div>
    <button class="btn" style="position:absolute; bottom:80px; z-index:100;" onclick="toScene(3)">收起花海 🌻</button>
</div>

<div class="scene" id="s3">
    <div class="glass-card">
        <div style="font-size:50px; margin-bottom:10px;">💐</div>
        <h2 style="color:var(--t-brown); margin:15px 0; font-size:26px;">母亲节快乐</h2>
        <div id="typed" style="min-height:120px; line-height:1.9; color:#795548; font-size:16px;"></div>
        <div class="name-sign">爱你的儿子：Alex</div>
        <button class="btn" onclick="toScene(4)">查看爱的礼物 🎁</button>
    </div>
</div>

<div class="scene" id="s4">
    <div class="glass-card">
        <h3 style="color:var(--t-brown); font-size:22px;">爱的兑换券</h3>
        <p style="font-size:0.85rem; color:#888; margin:6px 0 22px 0;">点击卡片即可核销使用</p>
        <div class="coupon-box">
            <div class="coupon-item" onclick="use(this)">洗碗一星期</div>
            <div class="coupon-item" onclick="use(this)">陪逛街不喊累</div>
            <div class="coupon-item" onclick="use(this)">专属拥抱券</div>
            <div class="coupon-item" onclick="use(this)">不准生气券</div>
            <div class="coupon-item" onclick="use(this)">捶背按摩券</div>
            <div class="coupon-item" onclick="use(this)">永远爱你券</div>
        </div>
        <button class="btn" onclick="showFinalSurprise()">❤️ 终极心意 ❤️</button>
    </div>
</div>

<script>
    const bgm = document.getElementById('bgm');
    let musicPlaying = false;

    // 音乐控制
    function togglePlay() {
        if(musicPlaying) { 
            bgm.pause(); 
            document.getElementById('music-toggle').innerText="🔇";
        } else { 
            bgm.play(); 
            document.getElementById('music-toggle').innerText="🎵";
        }
        musicPlaying = !musicPlaying;
    }

    // 场景切换
    function toScene(idx) {
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
        document.getElementById('s' + idx).classList.add('active');
        
        if(idx === 2) { 
            if(!musicPlaying) togglePlay(); 
            startGarden(); 
        }
        if(idx === 3) startType();
    }

    // 种花
    function startGarden() {
        const c = document.getElementById('garden-canvas');
        const ctx = c.getContext('2d');
        c.width = window.innerWidth;
        c.height = window.innerHeight;

        let tip = document.querySelector('.instruction');
        let touched = false;

        c.addEventListener('touchmove', (e) => {
            if(!touched){
                tip.style.opacity = '0';
                touched = true;
            }
            const t = e.touches[0];
            drawFlower(t.clientX, t.clientY);
        });
        
        function drawFlower(x, y) {
            const petals = 6;
            const r = Math.random() * 9 + 5;
            ctx.fillStyle = `rgba(255, ${160 + Math.random()*40}, ${190 + Math.random()*40}, 0.75)`;
            for(let i=0; i<petals; i++) {
                ctx.beginPath();
                ctx.arc(x + Math.cos(i*2*Math.PI/petals)*r, y + Math.sin(i*2*Math.PI/petals)*r, r, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.fillStyle = "#fff59d";
            ctx.beginPath(); ctx.arc(x, y, r/2, 0, Math.PI*2); ctx.fill();
        }
    }

    // 打字机
    function startType() {
        const text = "感谢你不是超人，\n却为我变成了万能。\n愿你被岁月温柔以待，\n永远平安快乐，\n永远是我最爱的少女！";
        let n = 0;
        const target = document.getElementById('typed');
        target.innerHTML = "";
        const timer = setInterval(() => {
            if(n < text.length) {
                target.innerHTML += text[n] === '\n' ? '<br>' : text[n];
                n++;
            } else { clearInterval(timer); }
        }, 90);
    }

    // 兑换券核销
    function use(el) {
        if(!el.classList.contains('used')) {
            el.classList.add('used');
            el.innerHTML += " ✅";
            if(window.navigator.vibrate) window.navigator.vibrate(40);
        }
    }

    // 最终惊喜
    function showFinalSurprise(){
        alert("妈妈，谢谢你一直爱我、守护我、包容我。\n我会永远爱你，母亲节快乐！\n—— Alex");
    }

    // 飘落花瓣
    const fallEmojis = ['🌸','💮','🌹','✨','💕','💖'];
    function createFall(){
        let f = document.createElement('div');
        f.className = 'fall-item';
        f.innerHTML = fallEmojis[Math.floor(Math.random()*fallEmojis.length)];
        f.style.left = Math.random()*100 + '%';
        f.style.animationDuration = Math.random()*5 + 6 + 's';
        document.body.appendChild(f);
        setTimeout(()=>f.remove(),12000);
    }
    setInterval(createFall,350);

    // 点击爱心爆炸
    document.addEventListener('click',(e)=>{
        for(let i=0;i<8;i++){
            setTimeout(()=>{
                let h = document.createElement('div');
                h.className = 'heart-burst';
                h.innerHTML = ['❤️','💖','💗','⭐','💞'][Math.floor(Math.random()*5)];
                h.style.left = e.clientX + (Math.random()-0.5)*90 + 'px';
                h.style.top = e.clientY + 'px';
                document.body.appendChild(h);
                setTimeout(()=>h.remove(),1800);
            },i*50);
        }
    });
</script>
</body>
</html>
